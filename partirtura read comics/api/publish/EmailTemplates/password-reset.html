<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperá tu contraseña - Comic Library</title>
</head>
<body style="margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif; background-color: #0f172a; color: #ffffff;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
        <tr>
            <td align="center" style="padding: 40px 0;">
                <table role="presentation" width="600" cellspacing="0" cellpadding="0" border="0" style="background-color: #1e293b; border-radius: 12px; padding: 40px;">
                    <tr>
                        <td align="center">
                            <h1 style="margin: 0 0 24px 0; font-size: 24px; color: #ffffff;">Comic Library</h1>
                            <p style="margin: 0 0 32px 0; font-size: 16px; color: #cbd5e1;">Recuperá tu contraseña</p>
                            
                            <!-- Cesta con el Código -->
                            <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0" style="margin-bottom: 24px;">
                                <tr>
                                    <td align="center">
                                        <div style="background-color: #0f172a; border: 2px dashed #6366f1; border-radius: 12px; padding: 20px 16px; max-width: 320px;">
                                             <span style="display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: #818cf8; font-weight: 700; margin-bottom: 24px;">Tu código de verificación</span>
                                             <br> 
                                             <span style="display: block; font-family: 'Courier New', Courier, monospace; font-size: 36px; font-weight: 800; letter-spacing: 8px; color: #ffffff; line-height: 1;">{{code}}</span>
                                         </div>
                                    </td>
                                </tr>
                            </table>

                            <p style="margin: 0 0 8px 0; font-size: 14px; color: #94a3b8;">El código vence en {{time to expire}}.</p>
                            <p style="margin: 0; font-size: 14px; color: #94a3b8;">Si no solicitaste este correo, ignorá este mensaje.</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
