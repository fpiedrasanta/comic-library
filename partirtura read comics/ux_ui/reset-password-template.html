<!DOCTYPE html>
<html lang="es" class="h-full bg-[#0b0f19]">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nueva Contraseña - Comic Library | NEPS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            nepsBg: '#0b0f19',
            nepsCard: '#131a26',
            nepsInput: '#0d121d',
            nepsPrimary: '#38bdf8',
            nepsAccent: '#f43f5e',
            nepsBorder: '#2d2c33',
            nepsMuted: '#64748b',
            nepsText: '#f8fafc'
          },
          boxShadow: { 'glow-blue': '0 4px 25px rgba(56, 189, 248, 0.12)' }
        }
      }
    }
  </script>
</head>
<body class="h-full text-nepsText antialiased bg-nepsBg font-sans flex items-center justify-center p-4 relative overflow-x-hidden">

  <div class="fixed top-0 right-0 w-[400px] h-[400px] bg-[radial-gradient(circle_at_85%_15%,rgba(56,189,248,0.08)_0%,transparent_70%)] pointer-events-none"></div>

  <main class="w-full max-w-md bg-nepsCard border border-nepsBorder rounded-2xl p-6 sm:p-8 shadow-glow-blue relative z-10">
    
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-nepsPrimary/10 text-nepsPrimary mb-3 border border-nepsPrimary/20">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/></svg>
      </div>
      <h1 class="text-xl font-bold text-white tracking-tight">Nueva contraseña</h1>
      <p class="text-xs text-nepsMuted mt-1">Escribí tu nueva clave para recuperar el acceso.</p>
    </div>

    <form id="reset-form" class="space-y-4" novalidate>
      <div>
        <label for="new-password" class="block text-xs font-medium text-nepsMuted mb-1">Nueva contraseña</label>
        <div class="relative">
          <input type="password" id="new-password" required placeholder="••••••••" minlength="8"
            class="w-full bg-nepsInput border border-nepsBorder focus:border-nepsPrimary focus:ring-1 focus:ring-nepsPrimary text-nepsText placeholder-slate-600 rounded-lg px-3.5 py-2.5 text-xs sm:text-sm outline-none transition-all duration-200 pr-10">
          <button type="button" id="toggle-password" class="absolute right-3 top-1/2 -translate-y-1/2 text-nepsMuted hover:text-white transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
          </button>
        </div>
      </div>

      <div>
        <label for="confirm-password" class="block text-xs font-medium text-nepsMuted mb-1">Confirmar nueva contraseña</label>
        <input type="password" id="confirm-password" required placeholder="••••••••"
          class="w-full bg-nepsInput border border-nepsBorder focus:border-nepsPrimary focus:ring-1 focus:ring-nepsPrimary text-nepsText placeholder-slate-600 rounded-lg px-3.5 py-2.5 text-xs sm:text-sm outline-none transition-all duration-200">
      </div>

      <button type="submit"
        class="w-full bg-nepsPrimary hover:bg-sky-400 text-nepsBg font-bold py-2.5 px-4 rounded-lg transition-all duration-200 text-xs sm:text-sm shadow-glow-blue active:scale-[0.99] mt-2">
        Guardar contraseña
      </button>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script>
    const toggleBtn = document.getElementById('toggle-password');
    const passInput = document.getElementById('new-password');

    toggleBtn.addEventListener('click', () => {
      passInput.type = passInput.type === 'password' ? 'text' : 'password';
    });

    document.getElementById('reset-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const pass = document.getElementById('new-password').value;
      const confirmPass = document.getElementById('confirm-password').value;

      if (!pass || !confirmPass) {
        Toastify({ text: "Por favor, completá ambos campos", duration: 3000, style: { background: "#f43f5e" } }).showToast();
        return;
      }
      if (pass.length < 8) {
        Toastify({ text: "La contraseña debe tener al menos 8 caracteres", duration: 3000, style: { background: "#f43f5e" } }).showToast();
        return;
      }
      if (pass !== confirmPass) {
        Toastify({ text: "Las contraseñas no coinciden", duration: 3000, style: { background: "#f43f5e" } }).showToast();
        return;
      }

      Swal.fire({
        title: '¡Contraseña actualizada!',
        text: 'Tu contraseña fue modificada correctamente. Ya podés iniciar sesión.',
        icon: 'success',
        background: '#131a26',
        color: '#f8fafc',
        confirmButtonColor: '#38bdf8'
      }).then(() => {
        window.location.href = 'login.html';
      });
    });
  </script>
</body>
</html>
